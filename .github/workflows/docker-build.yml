name: build-docker-images

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  DH_USER: ilolita945

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tags
        id: prep
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha_tag=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect Docker Hub secret
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "DH_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "DH_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::DOCKERHUB_TOKEN not set, pushing to GHCR only"
          fi

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: env.DH_ENABLED == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DH_USER" --password-stdin

      # ---------- backend (Go) ----------
      - name: Build & push backend (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.DH_USER }}/mqtt-mgr-backend:latest
            ghcr.io/${{ env.DH_USER }}/mqtt-mgr-backend:${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push backend (Docker Hub)
        if: env.DH_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DH_USER }}/mqtt-mgr-backend:latest
            ${{ env.DH_USER }}/mqtt-mgr-backend:${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ---------- nginx (Vue frontend) ----------
      - name: Build & push nginx (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.DH_USER }}/mqtt-mgr-nginx:latest
            ghcr.io/${{ env.DH_USER }}/mqtt-mgr-nginx:${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

      - name: Build & push nginx (Docker Hub)
        if: env.DH_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DH_USER }}/mqtt-mgr-nginx:latest
            ${{ env.DH_USER }}/mqtt-mgr-nginx:${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

  # ---------- 冒烟测试：拉取刚发布的镜像，起完整三容器栈，打真实接口 ----------
  smoke-test:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime files
        run: touch mosquitto/config/passwd mosquitto/config/acl

      - name: Point compose at published images
        run: |
          sed -i "s|registry.cn-hangzhou.aliyuncs.com/fjrcn/mqtt-mgr-backend:latest|${{ env.DH_USER }}/mqtt-mgr-backend:latest|" docker-compose.yaml
          sed -i "s|registry.cn-hangzhou.aliyuncs.com/fjrcn/mqtt-mgr-nginx:latest|${{ env.DH_USER }}/mqtt-mgr-nginx:latest|" docker-compose.yaml
          grep "image:" docker-compose.yaml

      - name: Start full stack
        run: docker compose up -d

      - name: Health checks
        run: |
          ok=""
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1/api/register/status >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "✗ /api/register/status 未就绪"
            docker compose ps; docker compose logs --tail=60
            exit 1
          fi
          echo "✓ /api/register/status OK"
          curl -sf http://127.0.0.1/api/register/status | grep -q '{' && echo "✓ 后端 JSON 响应 OK"
          curl -sf http://127.0.0.1/ | grep -q 'id="app"' && echo "✓ 前端页面 OK"

      - name: Teardown
        if: always()
        run: docker compose down -v
