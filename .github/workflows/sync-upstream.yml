name: sync-upstream

on:
  schedule:
    - cron: "0 3 * * *"   # 每日 03:00 UTC = 北京 11:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync from upstream
        id: sync
        run: |
          git remote add upstream https://github.com/FUjr/tc1_mqtt.git
          git fetch upstream master --quiet
          BEHIND=$(git rev-list --count master..upstream/master)
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "::notice::已与上游同步，无需更新"
            exit 0
          fi
          git config user.name "ilolita945"
          git config user.email "ilolita945@users.noreply.github.com"
          git rebase upstream/master
          # fork 历史曾因上游 force-push 分叉，rebase 后必须强制推送才能落库
          git push --force-with-lease origin master
          echo "::notice::已同步上游 ${BEHIND} 个提交并推送"

      - name: Rebuild images
        if: steps.sync.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-build.yml --ref master
